<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Strava Redirect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.5; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Đang chuyển về ứng dụng Mock Runner…</h1>
  <p>Nếu app không tự mở trong vài giây, hãy bấm nút bên dưới.</p>
  <button id="open-app">Mở Mock Runner thủ công</button>

  <script>
    (function () {
      const query = window.location.search || '';
      const appUrl = 'mockrunner://oauth/strava' + window.location.search;

      // Thử mở app ngay lập tức
      window.location.replace(appUrl);

      // Hiển thị nút fallback sau 1.5s
      const btn = document.getElementById('open-app');
      setTimeout(() => {
        btn.classList.remove('hidden');
        btn.addEventListener('click', () => {
          window.location.href = appUrl;
        });
      }, 1500);

      // Nếu người dùng quay trở lại, cung cấp link kiểm tra
      setTimeout(() => {
        if (document.visibilityState === 'visible') {
          document.body.insertAdjacentHTML('beforeend',
            '<p>Không mở được app? Kiểm tra lại quyền deep link hoặc cài đặt app.</p>');
        }
      }, 3000);
    })();
  </script>
</body>
</html>
